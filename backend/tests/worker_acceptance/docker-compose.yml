services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codesage_acceptance
      POSTGRES_PASSWORD: codesage_acceptance
      POSTGRES_DB: codesage_acceptance
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesage_acceptance -d codesage_acceptance"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
