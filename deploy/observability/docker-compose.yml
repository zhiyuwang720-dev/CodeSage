services:
  phoenix:
    image: arizephoenix/phoenix:version-20.8.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  phoenix_data:
