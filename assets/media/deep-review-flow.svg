<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">CodeSage Deep Review — from change to evidence-backed comments</title>
  <desc id="desc">Three rows show deterministic preparation, AI planning and parallel review, then evidence extraction, Cross verification and final reports. Four read-only tools access the same fixed Git snapshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091323"/><stop offset="1" stop-color="#14243b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#4adecf"/><stop offset="1" stop-color="#729cff"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8299ba"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .card { fill:#17283e; stroke:#304862; stroke-width:1.5; }
      .name { fill:#f1f6ff; font-size:25px; font-weight:700; }
      .body { fill:#bfcee3; font-size:17px; }
      .tag { fill:#65e3ce; font-size:12px; font-weight:700; letter-spacing:1.8px; }
      .model { fill:#b7a3ff; }
      .edge { fill:none; stroke:#8299ba; stroke-width:2; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="920" rx="24" fill="url(#bg)"/>
  <rect x="56" y="48" width="58" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="56" y="95" fill="#f5f8ff" font-size="36" font-weight="700">CodeSage Deep Review</text>
  <text x="56" y="128" fill="#9db2ce" font-size="18">Plan investigations. Read the code. Challenge every claim.</text>
  <text x="1054" y="91" class="tag">CODE</text><text x="1142" y="91" class="tag model">AI / HARNESS</text>
  <g class="edge">
    <path d="M458 263H499"/><path d="M924 263H965"/><path d="M1172 338V374"/>
    <path d="M970 463H935"/><path d="M504 463H469"/><path d="M253 538V574"/>
    <path d="M458 663H499"/><path d="M924 663H965"/>
  </g>
  <g transform="translate(56 184)">
    <rect width="402" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag">01 · CODE</text><text x="24" y="66" class="name">Fixed Git input</text>
    <text x="24" y="101" class="body">Resolve refs · classify review / context</text><text x="24" y="127" class="body">Cached diffs · safe read-only snapshot</text>
  </g>
  <g transform="translate(510 184)">
    <rect width="414" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag">02 · CODE</text><text x="24" y="66" class="name">Blast Radius + Anatomy</text>
    <text x="24" y="101" class="body">Direct Python import impact · diff stats</text><text x="24" y="127" class="body">Directory clusters · bounded scans</text>
  </g>
  <g transform="translate(976 184)">
    <rect width="408" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag model">03 · AI</text><text x="24" y="66" class="name">Semantic</text>
    <text x="24" y="101" class="body">Intent · risk hypotheses · bounded diff</text><text x="24" y="127" class="body">Guidance, not verified ground truth</text>
  </g>
  <g transform="translate(976 384)">
    <rect width="408" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag model">04 · HARNESS + CODE</text><text x="24" y="66" class="name">Planner + repair</text>
    <text x="24" y="101" class="body">Cohesive investigations · retain questions</text><text x="24" y="127" class="body">Fallback coverage · remap cross hints</text>
  </g>
  <g transform="translate(510 384)">
    <rect width="414" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag model">05 · PARALLEL HARNESSES</text><text x="24" y="66" class="name">Reviewers</text>
    <text x="24" y="101" class="body">Shared concurrency cap · read on demand</text><text x="24" y="127" class="body">Investigation + built-in worthiness</text>
  </g>
  <g transform="translate(56 384)">
    <rect width="402" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag">06 · CODE</text><text x="24" y="66" class="name">Evidence extraction</text>
    <text x="24" y="101" class="body">Stable candidate indices · local code</text><text x="24" y="127" class="body">Matching hunks · explicit unavailable state</text>
  </g>
  <g transform="translate(56 584)">
    <rect width="402" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag model">07 · HARNESS</text><text x="24" y="66" class="name">Cross Analysis</text>
    <text x="24" y="101" class="body">Verify · challenge · consistency · duplicates</text><text x="24" y="127" class="body">Compound risks · keep / drop by index</text>
  </g>
  <g transform="translate(510 584)">
    <rect width="414" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag">08 · CODE</text><text x="24" y="66" class="name">Merge gate</text>
    <text x="24" y="101" class="body">Accept decisions · exact dedup · severity</text><text x="24" y="127" class="body">Stable ranking · business-content hash</text>
  </g>
  <g transform="translate(976 584)">
    <rect width="408" height="154" rx="16" class="card"/>
    <text x="24" y="30" class="tag">09 · AUDITABLE OUTPUT</text><text x="24" y="66" class="name">Two reports + traces</text>
    <text x="24" y="101" class="body">Final result · stage-by-stage process report</text><text x="24" y="127" class="body">JSONL events · SQLite Harness sessions</text>
  </g>
  <rect x="56" y="778" width="1328" height="88" rx="14" fill="#102236" stroke="#315673"/>
  <text x="80" y="812" fill="#72e4d2" font-size="17" font-weight="700">ONE FIXED SNAPSHOT · FOUR READ-ONLY TOOLS</text>
  <text x="80" y="843" fill="#c3d2e5" font-size="18">file_read · file_read_diff · file_find · code_search</text>
  <text x="914" y="843" fill="#a6bbd5" font-size="15">Structured Harness output → FinalizeReview</text>
</svg>
